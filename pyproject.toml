[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-operations-engine"
version = "0.1.0"
description = "A Python warehouse operations engine for inventory management, order processing, analytics, and route optimization."
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.setuptools.packages.find]
where = ["src"]